name: TokenBalanceMonitor
options:
  bundleIdPrefix: com.panyue
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    WATCHOS_DEPLOYMENT_TARGET: "10.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TokenBalanceMonitor:
    type: application
    platform: iOS
    sources:
      - path: TokenBalanceMonitor
      - path: Shared
        excludes:
          - TokenMonitorConfig.example
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panyue.TokenBalanceMonitor
        PRODUCT_NAME: TokenBalanceMonitor
        INFOPLIST_FILE: TokenBalanceMonitor/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: TokenBalanceWidgetExtension
        embed: true
  TokenBalanceWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TokenBalanceWidget
      - path: Shared
        excludes:
          - TokenMonitorConfig.example
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panyue.TokenBalanceMonitor.widget
        PRODUCT_NAME: TokenBalanceWidgetExtension
        INFOPLIST_FILE: TokenBalanceWidget/Info.plist
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  TokenBalanceWatch:
    type: application
    platform: watchOS
    sources:
      - path: TokenBalanceWatch
      - path: Shared
        excludes:
          - TokenMonitorConfig.example
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panyue.TokenBalanceMonitor.watch
        PRODUCT_NAME: TokenBalanceWatch
        INFOPLIST_FILE: TokenBalanceWatch/Info.plist
